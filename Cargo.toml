[package]
name = "spinney"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.37"
keyring = { version = "3.6.3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
anyhow = "1"
rfd = "0.17"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
