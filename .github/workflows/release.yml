name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.0.0)
        required: true
  # From prerelease.yml, which creates the tag: a tag pushed with its token starts no workflow.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ASSET: Spinney-macos-arm64.zip
    steps:
      # Validate before the value reaches checkout or any command.
      - name: Refuse anything that isn't a version tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          # Publishing uses GH_TOKEN, and the repo is public, so git itself needs no token.
          persist-credentials: false
      - name: Tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main"; exit 1; }
      # v1.1.0 must be the Cargo.toml version; v1.1.0-beta.N and -rc.N are for it, before it's out.
      - name: Tag matches the Cargo.toml version
        run: bash scripts/release-tag.sh check "$TAG"
      # A stable release's own CHANGELOG.md section, or Unreleased for a beta or rc. A stable tag
      # without a section fails here, before anything is built.
      - name: Release notes from CHANGELOG.md
        run: bash scripts/changelog.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"
      # Before the fixture identity is set, or the script flags that email in this file.
      - run: bash scripts/leak-check.sh
      - run: rustup update stable && rustup component add clippy rustfmt
      # No rust-cache here: a release builds from scratch, so no cached artifact can end up in what we publish.
      - name: Builds on the declared rust-version
        run: bash scripts/msrv-check.sh --install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      # Advisories (vulnerable or yanked crates), licences and sources; see deny.toml.
      - name: Dependencies pass cargo-deny
        run: cargo deny --locked check
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash scripts/bundle.sh "${TAG#v}"
      - name: Installer installs the bundle
        run: bash scripts/smoke-install.sh "${TAG#v}"
      - name: Checksum
        run: cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256"
      # Lets anyone check the zip was built here: gh attestation verify <zip> --repo <this repo>.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET }}
      # A prerelease (v1.2.0-rc.1) is never "latest", which install.sh downloads.
      - name: Publish release
        run: |
          files=("dist/$ASSET" "dist/$ASSET.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            pre=()
            [[ "$TAG" == *-* ]] && pre=(--prerelease)
            # The changelog's notes, then GitHub's list of the PRs merged since the last release.
            gh release create "$TAG" "${files[@]}" --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes --verify-tag "${pre[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
