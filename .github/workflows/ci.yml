name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the fixture identity is set, or the script flags that email in this file.
      - run: bash scripts/leak-check.sh
      - run: rustup update stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Release tag rules
        run: bash scripts/test-release-tag.sh
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      # Advisories (vulnerable or yanked crates), licences and sources; see deny.toml.
      - name: Dependencies pass cargo-deny
        run: cargo deny --locked check

  # The release workflow runs this too; here it fails on the PR instead of on release day.
  msrv:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: bash scripts/msrv-check.sh --install

  # Builds the release bundle and installs it with install.sh, as the release workflow does.
  bundle:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable
      # Fine here: nothing this job builds is published.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Bundle and install
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          bash scripts/bundle.sh "$version"
          bash scripts/smoke-install.sh "$version"

  # Lints the workflows themselves: unpinned actions, injection through ${{ }}, over-broad tokens.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Through install-action, which the repo's Actions allow-list already permits.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.31.1
      - name: Workflows pass zizmor
        run: zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }} # online audits: known-vulnerable action versions
