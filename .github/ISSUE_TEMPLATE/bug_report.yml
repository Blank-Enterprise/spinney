name: Bug report
description: Something in Spinney doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through [private reporting](https://github.com/Blank-Enterprise/spinney/security/advisories/new), not here.
        Please remove tokens, private repo names and personal paths from anything you paste.
  - type: input
    id: spinney-version
    attributes:
      label: Spinney version
      description: The release you installed, e.g. 1.0.0, or a commit if you built it yourself.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.4 on an M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include any error message, and a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Project layout (normal clone or worktree layout), git version, the remote host.
